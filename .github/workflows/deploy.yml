name: Deploy to LH.pl

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6

      - name: Zainstaluj lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Sprawdz konfiguracje
        env:
          FTP_HOST: ${{ secrets.LH_FTP_HOST }}
          FTP_USER: ${{ secrets.LH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LH_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "BRAK LH_FTP_HOST"
            exit 1
          fi

          if [ -z "$FTP_USER" ]; then
            echo "BRAK LH_FTP_USER"
            exit 1
          fi

          if [ -z "$FTP_PASSWORD" ]; then
            echo "BRAK LH_FTP_PASSWORD"
            exit 1
          fi

          echo "Wszystkie sekrety sa ustawione"

      - name: Deploy na LH.pl
        env:
          FTP_HOST: ${{ secrets.LH_FTP_HOST }}
          FTP_USER: ${{ secrets.LH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LH_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e "
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 20;

            mirror --reverse \
              --delete \
              --verbose \
              --exclude-glob .git/ \
              --exclude-glob .github/ \
              --exclude-glob .cursor/ \
              --exclude-glob scripts/ \
              --exclude-glob serve.py \
              --exclude-glob package.json \
              --exclude-glob README.md \
              --exclude-glob assets/images/README.md \
              ./ /;

            bye;
          "