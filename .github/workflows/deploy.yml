name: Deploy to LH.pl

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v6

      - name: Zainstaluj lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sprawdź konfigurację
        env:
          FTP_HOST: ${{ secrets.LH_FTP_HOST }}
          FTP_USER: ${{ secrets.LH_FTP_USER }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "BRAK LH_FTP_HOST"
            exit 1
          fi

          if [ -z "$FTP_USER" ]; then
            echo "BRAK LH_FTP_USER"
            exit 1
          fi

          echo "FTP host jest ustawiony"
          echo "FTP user jest ustawiony"

      - name: Deploy na LH.pl
        env:
          FTP_HOST: ${{ secrets.LH_FTP_HOST }}
          FTP_USER: ${{ secrets.LH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LH_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" -e "
            set ftp:passive-mode true;
            mirror --reverse \
              --delete \
              --verbose \
              --exclude .git/ \
              --exclude .github/ \
              ./ /;
            bye;
          "